name: Build ISO

# Builds the sOnOs ISO in an archlinux container.
#
#   - a "v*" tag: builds, then creates the GitHub Release with the checksum
#   - "Run workflow" (workflow_dispatch): builds only, the ISO is a workflow artifact
#
# Disk: the package cache, the unpacked system, the squashfs image and the ISO together
# need roughly 18 to 20 GB for this package list, and a hosted runner has about 14 GB free.
# The first step frees more; if a build still stops with "No space left on device", use a
# larger runner. This estimate has not been measured on a runner yet.
#
# Optional secrets and variables, see docs/signing.md:
#   GPG_PRIVATE_KEY, GPG_PASSPHRASE   sign the ISO
#   SF_SSH_KEY                        upload the ISO to SourceForge
#   vars.SF_USER, vars.SF_PROJECT     SourceForge user and project name

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      # "if:" cannot read secrets, so their presence becomes a flag here
      HAVE_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY != '' }}
      HAVE_SF_KEY: ${{ secrets.SF_SSH_KEY != '' }}
    steps:
      - name: Free disk space on the runner
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force
          df -h /

      - name: Check out sOnOs
        uses: actions/checkout@v4
        with:
          path: sOnOs

      - name: Check out sOnInstall
        uses: actions/checkout@v4
        with:
          repository: sOn-Os/sOnInstall
          path: sOnInstall

      - name: Build the [sonos] repository and the ISO
        run: |
          docker run --rm --privileged \
            --volume "$PWD:/work" \
            archlinux:latest /work/sOnOs/scripts/ci-build-iso.sh

      - name: Write the checksum
        id: iso
        working-directory: sOnOs/out
        run: |
          sudo chown -R "$(id -u):$(id -g)" .
          shopt -s nullglob
          isos=(*.iso)
          if (( ${#isos[@]} != 1 )); then
            echo "::error::expected one ISO in out/, found ${#isos[@]}"
            exit 1
          fi
          iso=${isos[0]}
          sha256sum "$iso" > "$iso.sha256"
          cat "$iso.sha256"
          size=$(stat --format=%s "$iso")
          {
            echo "name=$iso"
            echo "size=$size"
            # GitHub refuses release files of 2 GiB and over
            if (( size < 2147483648 )); then echo "fits=true"; else echo "fits=false"; fi
          } >> "$GITHUB_OUTPUT"
          {
            echo "### $iso"
            echo
            echo "- Size: $(numfmt --to=iec-i --suffix=B "$size")"
            echo "- SHA256: \`$(cut -d' ' -f1 "$iso.sha256")\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Sign the ISO
        if: env.HAVE_GPG_KEY == 'true'
        working-directory: sOnOs/out
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          ISO: ${{ steps.iso.outputs.name }}
        run: |
          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          gpg --batch --import <<< "$GPG_PRIVATE_KEY"
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --output "$ISO.sig" --detach-sign "$ISO" <<< "$GPG_PASSPHRASE"
          gpg --batch --verify "$ISO.sig" "$ISO"
          gpgconf --kill gpg-agent
          rm -rf -- "$GNUPGHOME"

      - name: Keep the ISO as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: sOnOs-iso
          path: |
            sOnOs/out/*.iso
            sOnOs/out/*.iso.sha256
            sOnOs/out/*.iso.sig
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

      - name: Create the release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: sOnOs/out
        env:
          GH_TOKEN: ${{ github.token }}
          ISO: ${{ steps.iso.outputs.name }}
          FITS: ${{ steps.iso.outputs.fits }}
          TAG: ${{ github.ref_name }}
        run: |
          files=("$ISO.sha256")
          if [[ -f $ISO.sig ]]; then files+=("$ISO.sig"); fi
          if [[ $FITS == true ]]; then
            files+=("$ISO")
            notes="The ISO is attached. Check it with: sha256sum -c $ISO.sha256"
          else
            notes="The ISO is over GitHub's 2 GiB limit for release files, so it is not attached here. Download it from https://son-os.github.io/#indir and check it with: sha256sum -c $ISO.sha256"
          fi
          gh release create "$TAG" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" --title "sOnOs $TAG" --notes "$notes"

      - name: Upload to SourceForge
        if: env.HAVE_SF_KEY == 'true' && startsWith(github.ref, 'refs/tags/v')
        working-directory: sOnOs/out
        env:
          SF_SSH_KEY: ${{ secrets.SF_SSH_KEY }}
          SF_USER: ${{ vars.SF_USER }}
          SF_PROJECT: ${{ vars.SF_PROJECT }}
          TAG: ${{ github.ref_name }}
        run: |
          if [[ -z $SF_USER || -z $SF_PROJECT ]]; then
            echo "::error::set the repository variables SF_USER and SF_PROJECT, see docs/signing.md"
            exit 1
          fi
          install -d -m 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/sourceforge
          printf '%s\n' "$SF_SSH_KEY" > ~/.ssh/sourceforge
          # The host key is taken on first contact. To pin it, replace this line with the
          # key published in SourceForge's documentation.
          ssh-keyscan frs.sourceforge.net >> ~/.ssh/known_hosts
          shopt -s nullglob
          files=(./*.iso ./*.iso.sha256 ./*.iso.sig)
          rsync --archive --verbose --partial --mkpath \
            --rsh "ssh -i $HOME/.ssh/sourceforge" \
            "${files[@]}" \
            "$SF_USER@frs.sourceforge.net:/home/frs/project/$SF_PROJECT/$TAG/"
          rm -f ~/.ssh/sourceforge
