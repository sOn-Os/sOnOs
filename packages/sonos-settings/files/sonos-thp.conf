# Transparent huge pages: compact memory in the background, and only stall a program for it
# when the program asked for huge pages (madvise). Avoids stutter in games.
w! /sys/kernel/mm/transparent_hugepage/defrag - - - - defer+madvise
# Split huge pages that are mostly empty instead of keeping them whole, so huge pages do not
# waste memory (kernel 6.12 and newer)
w! /sys/kernel/mm/transparent_hugepage/khugepaged/max_ptes_none - - - - 409
