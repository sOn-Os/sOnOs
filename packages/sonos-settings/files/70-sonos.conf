# sOnOs memory and kernel settings. sOnOs swaps to zram (compressed RAM), which changes
# what good values are. To change one, put it in /etc/sysctl.d/99-local.conf.

# zram is much faster than a disk, so swapping out idle pages early keeps more RAM for
# the page cache and the programs in use
vm.swappiness = 100

# Read one page at a time from swap: read-ahead helps on disks, not on zram
vm.page-cluster = 0

# Keep directory and inode caches longer: faster file browsing and builds
vm.vfs_cache_pressure = 50

# Write dirty pages in smaller batches, so a large copy does not freeze the desktop.
# Fixed sizes instead of percentages, which grow too large on machines with much RAM.
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 67108864
vm.dirty_writeback_centisecs = 1500

# The NMI watchdog fires interrupts on every CPU for debugging hard lockups; desktops
# do not need it, and turning it off saves a little power and latency
kernel.nmi_watchdog = 0

# Keep kernel messages off the console during boot, errors still show
kernel.printk = 3 3 3 3

# Room for more incoming packets per CPU before they are dropped, for fast networks
net.core.netdev_max_backlog = 4096
