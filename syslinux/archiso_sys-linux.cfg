LABEL arch
TEXT HELP
Boot the sOnOs install medium on BIOS.
It allows you to install sOnOs or perform system maintenance.
ENDTEXT
MENU LABEL sOnOs install medium (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=50% %KERNEL_PARAMS%

# Accessibility boot option
LABEL archspeech
TEXT HELP
Boot the sOnOs install medium on BIOS with speakup screen reader.
It allows you to install sOnOs or perform system maintenance with speech feedback.
ENDTEXT
MENU LABEL sOnOs install medium (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=50% accessibility=on %KERNEL_PARAMS%
